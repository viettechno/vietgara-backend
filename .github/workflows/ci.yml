name: CI

# Checks only: build, lint, tests, vulnerability scan and the blackbox suite against a stack made of the image
# built from this commit. Nothing is published here.
#   - every pull request;
#   - called by publish.yml (push to master, tag v*), so the same checks gate what is published.
# Pushing the image (up to the registry) is publish.yml; deploying to a VM is vietgara-infra's Deploy staging and
# Deploy production workflows, by hand.

on:
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default (SR-21); a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests with coverage gate
        run: make test-unit

  # Known vulnerabilities in the Go toolchain and the modules the code reaches.
  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # The blackbox suite is a separate module with its own dependencies.
      - name: govulncheck (testing/blackbox)
        working-directory: testing/blackbox
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      # The blackbox suite is a separate module; lint it with the same config.
      - name: golangci-lint (testing/blackbox)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: testing/blackbox
          args: --config ../../.golangci.yml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: make test-integration

  # The real backend image behind Kong, on Postgres, Redis and Kafka, with
  # Mailpit and google-stub in place of Mailjet and Google, driven over the
  # public REST API (testing/blackbox).
  blackbox:
    name: Blackbox tests (stubbed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: testing/blackbox/go.mod
          cache-dependency-path: testing/blackbox/go.sum

      - name: Blackbox tests
        run: make blackbox-stubbed

      # The load test is run by hand, so CI only proves its script still parses.
      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.3.0

      - name: Load test script parses
        run: k6 inspect -e POPULATION="$PWD/testing/loadtest/sample-population.json" testing/loadtest/flow.js > /dev/null

  # Scenario traceability and API coverage need no running stack: the check
  # reads the scenario sources, the checked-in ID snapshot and the OpenAPI
  # document. Unknown scenario IDs and documented P1/P2 scenarios without a
  # test fail the job; coverage below the gate reports as a warning.
  traceability:
    name: Scenario traceability and API coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: testing/blackbox/go.mod
          cache-dependency-path: testing/blackbox/go.sum

      - name: Traceability and API coverage
        run: make blackbox-traceability
