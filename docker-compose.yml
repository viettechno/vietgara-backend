version: "3.9"

# Local environment: Postgres, Redis, Kafka (KRaft, single node), Mailpit,
# the backend, the web admin, the platform admin and Kong. Open
# http://localhost:8000 (garage web admin + /api), http://admin.localhost:8000
# (platform admin + /api; *.localhost resolves to loopback in browsers) and
# http://localhost:8025 (Mailpit: every e-mail the backend sends, e.g.
# verification OTPs).

services:
  vietgara-pgsql:
    image: postgres:18.4
    container_name: vietgara-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - /Users/akagi/Storages/viettechno/vietgara/postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vietgara-network

  # Sessions, OTPs, entitlement cache and transaction counters (Memorystore
  # in GCP), shared by backend instances.
  vietgara-redis:
    image: redis:7-alpine
    container_name: vietgara-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vietgara-network

  # Event bus (ADR-004): the outbox relay publishes, module consumers read.
  vietgara-kafka:
    image: apache/kafka:3.9.1
    container_name: vietgara-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://vietgara-kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@vietgara-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - vietgara-network

  # Local SMTP server that catches every e-mail (MAIL_PROVIDER=smtp).
  vietgara-mailpit:
    image: axllent/mailpit:latest
    container_name: vietgara-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - vietgara-network

  vietgara-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietgara-backend
    restart: unless-stopped
    depends_on:
      vietgara-pgsql:
        condition: service_healthy
      vietgara-redis:
        condition: service_healthy
      vietgara-kafka:
        condition: service_healthy
      vietgara-mailpit:
        condition: service_started
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Migrations run as the database owner; the backend itself connects as
      # APP_DB_USER, a member of vietgara_app that is subject to RLS.
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@vietgara-pgsql:5432/${POSTGRES_DB}?sslmode=disable
      APP_DB_USER: ${APP_DB_USER:-vietgara_local}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-vietgara_local}
      DATABASE_URL: postgres://${APP_DB_USER:-vietgara_local}:${APP_DB_PASSWORD:-vietgara_local}@vietgara-pgsql:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-20m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      GRPC_PORT: 50051
      HTTP_PORT: 8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${KONG_PROXY_PORT:-8000}}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      REDIS_ADDR: vietgara-redis:6379
      ENTITLEMENT_CACHE_TTL: ${ENTITLEMENT_CACHE_TTL:-5m}
      KAFKA_BROKERS: vietgara-kafka:9092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-vietgara}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-vietgara-backend}
      OUTBOX_RELAY_INTERVAL: ${OUTBOX_RELAY_INTERVAL:-1s}
      LICENSE_EXPIRY_JOB_INTERVAL: ${LICENSE_EXPIRY_JOB_INTERVAL:-1h}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-support@viettechno.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VietGara}
      SMTP_HOST: vietgara-mailpit
      SMTP_PORT: 1025
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/data/uploads
    volumes:
      - vietgara-uploads:/app/data/uploads
    # Native gRPC is intentionally internal; Kong is the application entry point.
    expose:
      - "50051"
      - "8080"
    networks:
      - vietgara-network

  vietgara-owner-web:
    build:
      context: ../vietgara-owner-web
      dockerfile: Dockerfile
    container_name: vietgara-owner-web
    restart: unless-stopped
    networks:
      - vietgara-network

  vietgara-admin-web:
    build:
      context: ../vietgara-admin-web
      dockerfile: Dockerfile
    container_name: vietgara-admin-web
    restart: unless-stopped
    networks:
      - vietgara-network

  vietgara-api-gateway:
    image: kong:3.9
    container_name: vietgara-api-gateway
    restart: unless-stopped
    depends_on:
      - vietgara-backend
      - vietgara-owner-web
      - vietgara-admin-web
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: warn
      # Logo uploads are base64 JSON (max 1 MB of image).
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 4m
    ports:
      # Single local entry point: the garage web admin is served at http://localhost:8000 and the
      # platform admin at http://admin.localhost:8000.
      - "${KONG_PROXY_PORT:-8000}:8000"
      # Bind the Admin API to loopback only; it is not an application-facing API.
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - vietgara-network

volumes:
  vietgara-uploads:

networks:
  vietgara-network:
    driver: bridge
