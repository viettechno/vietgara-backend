name: Publish

# Builds the image, scans it and pushes it to the GitHub Container Registry (ghcr.io/<owner>/vietgara-backend), once the
# checks of ci.yml pass. It does not deploy: staging and production are deployed by hand from vietgara-infra
# (Actions > Deploy staging / Deploy production).
#
#   push to master   v1.1.0-3-gabc1234 (`git describe`: the last tag, the commits since it, the commit), or
#                    abc1234 before the first tag
#   tag v*           v1.1.0; production runs these
#
# One platform: the VMs are Linux x86_64. A fixable HIGH or CRITICAL finding in the image (operating-system
# packages, and the Go modules compiled into the binary) stops the run before anything is pushed (Release 8.0).

on:
  push:
    branches: [master]
    tags: ['v*']

# One group per commit: GitHub keeps only one pending run per group, so a group per branch would drop the image
# of a commit that is merged while another is publishing.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

# Read-only by default (SR-21); the image job asks for packages: write itself.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags and history

      - name: Image tag
        id: version
        run: echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ steps.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scan:local
          build-args: APK_REFRESH=${{ github.run_id }}
          cache-from: type=gha

      - name: Scan image for vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed scan:local

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APK_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ steps.meta.outputs.tags }}\`"
            echo ""
            echo "Deploy on staging: Actions > Deploy staging in vietgara-infra, with the backend tag \`${{ steps.version.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
