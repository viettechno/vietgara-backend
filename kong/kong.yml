_format_version: "3.0"
_transform: true

services:
  # The platform admin SPA, on its own host. Kong picks a route with a host
  # over the catch-all "/" route below, so only admin.localhost reaches it.
  - name: admin-web
    url: http://vietgara-admin-web:80
    routes:
      - name: admin-web-route
        hosts:
          - admin.localhost
        paths:
          - /
        strip_path: false
        protocols:
          - http
          - https

  # The browser-facing SPA is the default route. Nginx handles client-side
  # routes so direct navigation to /staff or /login still loads the app.
  - name: owner-web
    url: http://vietgara-owner-web:80
    routes:
      - name: owner-web-route
        paths:
          - /
        strip_path: false
        protocols:
          - http
          - https

  # The REST/JSON API (API Specification): grpc-gateway in the backend serves
  # every /api/v1 path itself, so the prefix is kept.
  - name: backend-http
    url: http://vietgara-backend:8080
    routes:
      - name: backend-http-route
        paths:
          - /api
        strip_path: false
        protocols:
          - http
          - https
      # The platform admin calls the API on its own host (same origin).
      - name: admin-web-api-route
        hosts:
          - admin.localhost
        paths:
          - /api
        strip_path: false
        protocols:
          - http
          - https

  # Native gRPC for service-to-service and tooling clients on the network.
  # gRPC paths are /<package>.<Service>/<Method>: only our services and
  # reflection/health match, so "/" stays with the owner web SPA above (a
  # catch-all here makes Kong answer browsers "Non-gRPC request matched gRPC
  # route").
  - name: backend-grpc
    url: grpc://vietgara-backend:50051
    routes:
      - name: backend-grpc-route
        paths:
          - /vietgara.
          - /grpc.
        protocols:
          - grpc
