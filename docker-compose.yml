version: "3.9"

services:
  vietgara-pgsql:
    image: postgres:18.4
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - /Users/akagi/viettechno/vietgara/postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - vietgara-network

  vietgara-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietgara-backend
    restart: unless-stopped
    depends_on:
      vietgara-pgsql:
        condition: service_healthy
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@vietgara-pgsql:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-20m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      GRPC_PORT: 50051
    ports:
      - "${GRPC_PORT:-50051}:50051"
    networks:
      - vietgara-network

volumes:
  postgres-data:

networks:
  vietgara-network:
    driver: bridge
