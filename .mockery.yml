all: false
dir: "{{.InterfaceDir}}/mocks"
filename: "{{.SrcPackageName}}.go"
force-file-write: true
formatter: goimports
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "mocks"
recursive: false
template: testify
packages:
  github.com/viettechno/vietgara-backend/internal/platform/db:
    config:
      all: true
      dir: "./internal/mocks"
      filename: "platform_db.go"
  github.com/viettechno/vietgara-backend/internal/tenant/repository:
    config:
      all: true
      dir: "./internal/mocks"
      filename: "tenant_repository.go"
  github.com/jackc/pgx/v5:
    interfaces:
      Tx:
        config:
          filename: "pgx_tx.go"
          dir: "./internal/mocks"
      Row:
        config:
          filename: "pgx_row.go"
          dir: "./internal/mocks"
      Rows:
        config:
          filename: "pgx_rows.go"
          dir: "./internal/mocks"
