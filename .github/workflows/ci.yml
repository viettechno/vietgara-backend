name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests with coverage gate
        run: make test-unit

  # Known vulnerabilities in the Go toolchain and the modules the code reaches.
  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # The blackbox suite is a separate module with its own dependencies.
      - name: govulncheck (testing/blackbox)
        working-directory: testing/blackbox
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      # The blackbox suite is a separate module; lint it with the same config.
      - name: golangci-lint (testing/blackbox)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: testing/blackbox
          args: --config ../../.golangci.yml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: make test-integration

  # The real backend image behind Kong, on Postgres, Redis and Kafka, with
  # Mailpit and google-stub in place of Mailjet and Google, driven over the
  # public REST API (testing/blackbox).
  blackbox:
    name: Blackbox tests (stubbed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: testing/blackbox/go.mod
          cache-dependency-path: testing/blackbox/go.sum

      - name: Blackbox tests
        run: make blackbox-stubbed

      # The load test is run by hand, so CI only proves its script still parses.
      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.3.0

      - name: Load test script parses
        run: POPULATION="$PWD/testing/loadtest/sample-population.json" k6 inspect testing/loadtest/flow.js > /dev/null

  # Scenario traceability and API coverage need no running stack: the check
  # reads the scenario sources, the checked-in ID snapshot and the OpenAPI
  # document. Unknown scenario IDs fail the job; missing scenarios and
  # coverage below the gate report as warnings until the 4.1 batches land.
  traceability:
    name: Scenario traceability and API coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: testing/blackbox/go.mod
          cache-dependency-path: testing/blackbox/go.sum

      - name: Traceability and API coverage
        run: make blackbox-traceability

  # Builds the image on every run; on pushes to master and v* tags it is also
  # pushed to ghcr.io/<owner>/<repo>, tagged like `make image-push`
  # (git describe: v1.1.0 on a tag, v1.1.0-3-gabc1234 or abc1234 otherwise).
  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [build-and-test, vulncheck, lint, integration, blackbox]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags and history

      - name: Image tag
        id: version
        run: echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ steps.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A fixable HIGH or CRITICAL finding in the image (operating-system
      # packages, and for the backend the Go modules compiled into the binary)
      # blocks the build before anything is pushed (Release 8.0).
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scan:local
          cache-from: type=gha

      - name: Scan image for vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed scan:local

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Pushed \`${{ steps.meta.outputs.tags }}\`"
            echo ""
            echo "Deploy on the staging VM: \`make deploy BACKEND_TAG=${{ steps.version.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
